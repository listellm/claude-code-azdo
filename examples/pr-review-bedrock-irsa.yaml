# Example: Claude Code PR review using AWS Bedrock with IRSA or EKS Pod Identity.
#
# With IRSA or Pod Identity the agent pod automatically receives short-lived AWS
# credentials from the AWS SDK credential chain — no static keys in the pipeline.
#
# ─── Kubernetes setup (IRSA) ────────────────────────────────────────────────────
# Annotate the agent ServiceAccount so the AWS Pod Identity Webhook injects
# AWS_WEB_IDENTITY_TOKEN_FILE and AWS_ROLE_ARN into the pod:
#
#   apiVersion: v1
#   kind: ServiceAccount
#   metadata:
#     name: azdo-agent
#     namespace: azdo-agents
#     annotations:
#       eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/azdo-bedrock-role
#
# For K3s with a custom OIDC provider the annotation and injection mechanism are
# identical — only the OIDC provider URL in the trust policy differs.
#
# ─── Kubernetes setup (EKS Pod Identity) ────────────────────────────────────────
# No service account annotation is needed. Create the association instead:
#
#   aws eks create-pod-identity-association \
#     --cluster-name YOUR_CLUSTER \
#     --namespace azdo-agents \
#     --service-account azdo-agent \
#     --role-arn arn:aws:iam::ACCOUNT_ID:role/azdo-bedrock-role
#
# ─── IAM ────────────────────────────────────────────────────────────────────────
# See examples/iam/bedrock-permissions.json     — permissions policy
# See examples/iam/trust-policy-irsa.json       — trust policy for IRSA
# See examples/iam/trust-policy-pod-identity.json — trust policy for Pod Identity
# ─────────────────────────────────────────────────────────────────────────────────

trigger: none

pr:
  branches:
    include:
      - main

pool:
  name: your-agent-pool-name # replace with your agent pool

# No variable group needed — credentials come from the pod's IAM role.

stages:
  - stage: ClaudeCodeReview
    displayName: "Claude Code PR Review (Bedrock / IRSA)"
    jobs:
      - job: Review
        displayName: "AI code review via AWS Bedrock (IRSA)"
        steps:
          - checkout: self
            fetchDepth: 0
            displayName: "Checkout with full history"

          - task: ClaudeCodeBaseTask@2
            displayName: "Run Claude Code review"
            inputs:
              use_bedrock: true
              aws_region: us-east-1 # region must support Bedrock cross-region inference
              model: us.anthropic.claude-sonnet-4-5-20251001-v1:0
              # fallback_model: us.anthropic.claude-haiku-4-5-20251001-v1:0
              prompt: |
                Review the changes in this pull request.
                Focus on correctness, security, and adherence to project conventions.
                Report any issues found.
              post_pr_comments: true
              timeout_minutes: "15"
